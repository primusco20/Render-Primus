services:
  - type: web
    name: primus-barbershop
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # Add these in the Render dashboard (Settings > Environment) — do not
      # commit real secrets into this file:
      # - PAYMONGO_SECRET_KEY
      # - ANTHROPIC_API_KEY
      # - OPENAI_API_KEY
      # - GEMINI_API_KEY
